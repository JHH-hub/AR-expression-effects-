<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0710" />
<meta name="description" content="AR 表情互动原型：微笑下雨、大笑烟花，粒子与头部实时物理碰撞。" />
<title>微笑落雨 · 大笑烟花 — AR Expression Effects</title>
<link rel="stylesheet" href="./src/styles.css?v=20260926" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff3d0'/%3E%3Cstop offset='.55' stop-color='%23ffd46b'/%3E%3Cstop offset='1' stop-color='%23ff3e8f'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3C/svg%3E" />
<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>
<div id="stage">
  <!-- video 仅作 MediaPipe 帧源与 GPU 纹理源，画面由 WebGL 统一合成 -->
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>

  <!-- 直播间顶栏：主播卡 + 在线人数（直播特效的「场」由 UI 定义，不只靠粒子） -->
  <header id="topbar" class="hidden">
    <div class="anchor-card">
      <span class="avatar"><i>😊</i></span>
      <div class="anchor-meta">
        <span class="anchor-name">微笑落雨直播间</span>
        <span class="anchor-sub"><b id="viewers">1.2万</b> 人在看</span>
      </div>
      <span class="live-dot">LIVE</span>
    </div>
    <div class="top-right">
      <span class="watchers">
        <i class="wface">🙂</i><i class="wface">😄</i><i class="wface">🥳</i>
        <b id="hypeCount">0</b>
      </span>
      <button id="btnPerf" class="icon-btn" aria-pressed="false" title="性能面板">📊</button>
    </div>
  </header>

  <!-- 表情能量槽：直播间「人气进度条」的语言，而不是工程仪表 -->
  <div id="hud" class="hidden">
    <div class="hud-main">
      <span id="stateIcon" class="state-icon">🙂</span>
      <span id="stateTag" class="state-text neutral">等待表情…</span>
    </div>
    <div class="meters">
      <div class="meter">
        <span class="m-label">微笑</span>
        <span class="m-track"><i id="barSmile" class="m-fill cool"></i></span>
        <span class="m-val" id="valSmile">0.00</span>
      </div>
      <div class="meter">
        <span class="m-label">大笑</span>
        <span class="m-track"><i id="barLaugh" class="m-fill warm"></i></span>
        <span class="m-val" id="valLaugh">0.00</span>
      </div>
    </div>
  </div>

  <!-- 礼物横幅 + 连击：直播礼物的标志性 UI -->
  <div id="gift" class="hidden">
    <span class="gift-icon">🎆</span>
    <div class="gift-text">
      <strong>烟花绽放</strong>
      <span>笑容点亮直播间</span>
    </div>
    <span class="gift-combo" id="giftCombo">x1</span>
  </div>

  <!-- 飘心流：直播间点赞的视觉签名 -->
  <div id="hearts" aria-hidden="true"></div>

  <!-- 性能面板 -->
  <section id="perf" class="hidden">
    <div class="p-row"><span>FPS</span><b id="pFps">--</b></div>
    <div class="p-row"><span>粒子</span><b id="pCount">0</b></div>
    <div class="p-row"><span>画质</span><b id="pQuality">--</b></div>
    <div class="p-row"><span>推理</span><b id="pInfer">0.0 ms</b></div>
    <div class="p-row p-backend"><span>后端</span><b id="pBackend">-</b></div>
  </section>

  <!-- 校准浮层 -->
  <div id="calib" class="hidden">
    <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
      <circle cx="40" cy="40" r="34" class="ring-bg" />
      <circle cx="40" cy="40" r="34" class="ring-fg" id="calibRing" />
    </svg>
    <div class="calib-text">
      <strong>正在校准你的中性表情</strong>
      <span><i id="calibHint">请保持自然，不要笑</i>　<b id="calibPct">0%</b></span>
    </div>
  </div>

  <!-- 底部控制：直播间输入条形态（假评论框 + 圆形礼物按钮） -->
  <nav id="controls" class="hidden">
    <span class="fake-input">说点什么…</span>
    <button id="btnRecal" class="round-btn" title="重新校准">🎯</button>
    <button id="btnBurst" class="round-btn round-gift" title="放一发烟花">🎁</button>
  </nav>

  <div id="toast"></div>

  <!-- 启动页 -->
  <div id="gate">
    <div class="glow-bg" aria-hidden="true"></div>
    <div class="card">
      <span class="badge">LIVE 表情特效</span>
      <h1>笑一下<br />就<em>放烟花</em></h1>
      <p class="sub">笑得越猛，连击越高，排面越大。</p>
      <button id="btnStart">开启摄像头 · 进入直播间</button>
      <p id="gateMsg" class="msg"></p>
      <p class="tip">画面全部本地处理，不上传不存储</p>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js?v=20260926"></script>
</body>
</html>
